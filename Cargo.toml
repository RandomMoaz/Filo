[workspace]
resolver = "2"
members = ["crates/filo-core", "crates/filo-cli", "crates/filo-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["moaz hisham"]

[workspace.dependencies]
anyhow      = "1"
thiserror   = "2"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
chrono      = { version = "0.4", features = ["serde"] }
uuid        = { version = "1", features = ["v4", "serde"] }
walkdir     = "2"
directories = "6"

[profile.release]
opt-level = 3
lto = true
strip = true
